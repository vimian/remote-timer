services:
  reverse_proxy:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./reverse_proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - internal_network
      - external_network

  websocket:
    build:
      context: ./services/websocket
      dockerfile: Dockerfile
    environment:
      - WEBSOCKET_PORT=8080
    networks:
      - internal_network

  nextjs-frontend:
    build:
      context: ./services/nextjs-frontend
      dockerfile: Dockerfile
    networks:
      - internal_network

networks:
  internal_network:
    internal: true
  external_network:
